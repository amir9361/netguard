version: "3.9"

services:

  netguard-api:
    image: python:3.12-slim
    container_name: netguard-api
    restart: unless-stopped
    network_mode: host
    privileged: true
    pid: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - GATEWAY_IP=192.168.1.1
      - SUBNET=192.168.1.0/24
      - IFACE=wlan0
      - SCAN_INTERVAL=45
    volumes:
      - netguard_data:/data
    command: ["bash", "-c", "apt-get update -qq && apt-get install -y -qq libpcap-dev gcc curl nmap && pip install -q flask flask-cors scapy requests zeroconf && curl -fsSL https://raw.githubusercontent.com/amir9361/netguard/main/app.py -o /app.py && python /app.py"]

  netguard-ui:
    image: nginx:alpine
    container_name: netguard-ui
    restart: unless-stopped
    ports:
      - "8080:80"
    command: ["sh", "-c", "apk add --no-cache curl && curl -fsSL https://raw.githubusercontent.com/amir9361/netguard/main/index.html -o /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"]

volumes:
  netguard_data:
